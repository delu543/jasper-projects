name: Network rules tests
on:
  push:
    branches: [main]
    paths:
      - 'projects/networking/claude-residential-ip-rules/**'
      - '.github/workflows/network-rules.yml'
  pull_request:
    paths:
      - 'projects/networking/claude-residential-ip-rules/**'
      - '.github/workflows/network-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/networking/claude-residential-ip-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: node --test tests/routing.test.cjs tests/controller.test.cjs tests/watchdog.test.cjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      # Backend import only. CI does not pair with or configure a real phone.
      - if: runner.os == 'Windows' || runner.os == 'macOS'
        run: python -m pip install -r requirements-mobile.txt
      - if: runner.os == 'Windows' || runner.os == 'macOS'
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import mobile_usb; mobile_usb.load_backend(); print('Pinned USB backend imports; no device accessed')"
