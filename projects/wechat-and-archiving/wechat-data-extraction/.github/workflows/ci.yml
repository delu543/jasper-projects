name: regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify native macOS OFD lock semantics
        run: |
          /usr/bin/python3 -m unittest -v \
            live_tools.tests.test_wechat_safe_snapshot.SafeSnapshotTests.test_online_ofd_lock_survives_unrelated_close_and_releases
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          WECHAT_LOCAL_EXPORT_ALLOW_UNVERIFIED_PYTHON=1 \
          WECHAT_LOCAL_EXPORT_ALLOW_GITHUB_HOSTED_PYTHON=1 \
          WECHAT_LOCAL_EXPORT_PYTHON="$(command -v python3)" \
            ./scripts/setup_runtime_tools.sh
      - name: Run release checks
        run: ./scripts/release_check.sh

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Fresh Windows installation (no WeChat or real data)
        shell: powershell
        run: |
          .\scripts\codex_bootstrap.ps1 install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\codex_bootstrap.ps1 doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\codex_bootstrap.ps1 install
          exit $LASTEXITCODE
      - name: Native Windows safety and media integration
        # Fixture tests can diagnose native boundaries even if registration failed.
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $runtime = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'WeChatLocalExport\tools\python\Scripts\python.exe'
          & $runtime -m unittest discover -s live_tools/windows/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $runtime -m unittest content_vault.tests.test_message_parser content_vault.tests.test_image_crypto -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $runtime scripts/validate_public_repo.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $runtime portable_skill/scripts/validate_package.py
          exit $LASTEXITCODE
